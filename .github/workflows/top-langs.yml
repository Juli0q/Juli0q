name: Update top languages card

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&theme=github_dark&role=OWNER,ORGANIZATION_MEMBER"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: 2.1.4 # v2.1.4
      - uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e # v2.0.2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide=Dockerfile&theme=github_dark&role=OWNER,ORGANIZATION_MEMBER"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: 2.1.4 # v2.1.4
      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update top languages card"
          git push
